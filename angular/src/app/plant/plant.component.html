<div class="container">
    <img src="left-arrow.png" class="back-arrow" tabindex="0" (click)="goBack()" (keyup.enter)="goBack()" alt="Back">

    <ng-container *ngIf="set404">
        <h2>404 Plant Not Found</h2>
        <p class="no-plant">
            We don't have any data regarding this plant. Take a look at our
            <a href="index">index</a>
            to see what we are tracking.
        </p>
    </ng-container>

    <ng-container *ngIf="!set404">
        <h2>{{currPlant.name}}</h2>
        <h3>{{currPlant.taxonomy}}</h3>
        <div class="flex">
            <div class="description">
                <div class="description" [innerHTML]="currPlant.description"></div>
                <div class="legend">
                    <p class="legend-title">Legend</p>
                    <ol>
                        <li><a [href]="legendLink('origins')">Origins</a></li>
                        <li><a [href]="legendLink('removal')">Removal</a></li>
                        <li><a [href]="legendLink('pros')">Pros</a></li>
                        <li><a [href]="legendLink('cons')">Cons</a></li>
                        <li><a [href]="legendLink('notes')">Notes</a></li>
                    </ol>
                </div>
            </div>

            <img src="{{currPlant.image}}" class="image">
        </div>

        <h4 id="origins">Origins</h4>
        <hr>
        <div class="description" [innerHTML]="currPlant.origins"></div>
        <h4 id="removal">Removal</h4>
        <hr>
        <div class="description" [innerHTML]="currPlant.removal"></div>
        <h4 id="pros">Pros</h4>
        <hr>
        <div class="description" [innerHTML]="currPlant.pros"></div>
        <h4 id="cons">Cons</h4>
        <hr>
        <div class="description" [innerHTML]="currPlant.cons"></div>
        <!-- <h4 id="notes">Notes</h4>
        <hr>
        <div class="description" [innerHTML]="currPlant.notes"></div> -->
    </ng-container>
</div>
